<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Söhbət</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<!--
  QURAŞDIRMA (Firebase, pulsuz)
  1. console.firebase.google.com → "Add project" ilə layihə aç.
  2. Build → Authentication → Get started → Sign-in method → Google → Enable.
     Settings → Authorized domains bölməsinə saytının domenini əlavə et (məs. sayt-adin.netlify.app).
  3. Build → Firestore Database → Create database (production mode). Rules bölməsinə aşağıdakı qaydaları yapışdır:

     rules_version = '2';
     service cloud.firestore {
       match /databases/{db}/documents {
         match /rooms/{room} {
           allow read: if request.auth != null;
           allow create: if request.auth != null
             && request.resource.data.name is string
             && request.resource.data.name.size() > 0
             && request.resource.data.name.size() <= 40;
           match /messages/{m} {
             allow read: if request.auth != null;
             allow create: if request.auth != null
               && request.resource.data.uid == request.auth.uid
               && request.resource.data.text is string
               && request.resource.data.text.size() > 0
               && request.resource.data.text.size() <= 1000;
           }
         }
       }
     }

  4. Project settings → General → "Your apps" → Web (</>) → konfiqurasiya kodunu götür və
     aşağıdakı firebaseConfig içindəki dəyərləri onunla əvəz et.
  Konfiqurasiya doldurulmayıbsa, səhifə DEMO rejimində açılır (mesajlar yalnız həmin brauzerdə saxlanır).
-->
<style>
:root{
  --bg:#f5fafb; --surface:#ffffff; --ink:#0d2b33; --muted:#53707a; --line:#d9e8eb;
  --brand:#0e8f9b; --brand-ink:#ffffff; --soft:#dff3f4; --accent:#ff7a59; --accent-ink:#2b0d05;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08181c; --surface:#0f2429; --ink:#e8f5f6; --muted:#93b0b6; --line:#1d3a41;
  --brand:#3cc4cf; --brand-ink:#04171a; --soft:#103238; --accent:#ff8f72; --accent-ink:#2b0d05; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08181c; --surface:#0f2429; --ink:#e8f5f6; --muted:#93b0b6; --line:#1d3a41;
  --brand:#3cc4cf; --brand-ink:#04171a; --soft:#103238; --accent:#ff8f72; --accent-ink:#2b0d05; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* giriş */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:36px 28px;max-width:420px;width:100%;text-align:center;display:grid;gap:16px;justify-items:center}
.logo{width:56px;height:56px;border-radius:18px;background:var(--brand);display:grid;place-items:center}
.logo svg{width:32px;height:32px}
.card h1{font-family:var(--display);font-size:1.9rem;line-height:1.1;margin:0;letter-spacing:-.02em}
.card p{margin:0;color:var(--muted)}
.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:600;background:var(--accent);color:var(--accent-ink);min-height:48px}
.btn.wide{width:100%}
.note{font-size:.85rem;color:var(--muted);background:var(--soft);border-radius:14px;padding:10px 14px;text-align:left}
.field{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:12px 18px;min-height:48px;outline:none}
.field:focus{border-color:var(--brand)}
.dform{display:grid;gap:10px;width:100%}

/* tətbiq */
.app{display:grid;grid-template-columns:340px minmax(0,1fr);height:100vh;height:100dvh}
.side{display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line);min-height:0;min-width:0}
.side-h{display:flex;align-items:center;gap:12px;padding:14px 16px;padding-left:max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line)}
.side-h .who{flex:1;min-width:0}
.side-h b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-h small{color:var(--muted)}
.link{background:none;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:600;min-height:40px}
.link:hover{border-color:var(--brand)}
.tools{padding:12px 16px;padding-left:max(16px,env(safe-area-inset-left));display:grid;gap:10px}
.rooms{list-style:none;margin:0;padding:0 8px 12px;overflow-y:auto;flex:1;min-height:0}
.room{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:16px;padding:10px 12px;min-height:56px}
.room:hover{background:var(--soft)}
.room.on{background:var(--soft);box-shadow:inset 3px 0 0 var(--brand)}
.room span.rn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;overflow:hidden;color:#fff;font-weight:600;flex:none}
.av img{width:100%;height:100%;object-fit:cover}

.chat{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.chat-h{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-right:max(16px,env(safe-area-inset-right));background:var(--surface);border-bottom:1px solid var(--line);min-height:64px}
.chat-h .t{min-width:0}
.chat-h b{display:block;font-family:var(--display);font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-h small{color:var(--muted)}
.back{display:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-size:1.2rem;flex:none}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right)) 16px 16px;display:flex;flex-direction:column;gap:4px}
.empty{margin:auto;color:var(--muted);text-align:center;max-width:26ch}
.day{align-self:center;font-size:.75rem;color:var(--muted);background:var(--soft);padding:3px 12px;border-radius:999px;margin:10px 0 6px}
.m{max-width:min(78%,520px);padding:8px 13px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.m.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:6px}
.m.o{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.m .nm{display:block;font-size:.78rem;font-weight:600;color:var(--brand);margin-bottom:1px}
.m .tm{display:block;font-size:.7rem;opacity:.65;text-align:right;margin-top:2px}
.m.first{margin-top:8px}
.composer{display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));padding-right:max(16px,env(safe-area-inset-right));background:var(--surface);border-top:1px solid var(--line)}
.composer .field{flex:1;min-width:0}
.placeholder{margin:auto;color:var(--muted);text-align:center;display:grid;gap:6px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-size:.9rem;max-width:90vw;z-index:50}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .app.in-chat .side{display:none}
  .app:not(.in-chat) .chat{display:none}
  .back{display:grid;place-items:center}
  .side{border-right:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<section class="login" id="login">
  <div class="card">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M10 12a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v9a4 4 0 0 1-4 4H19l-6 5v-5h-1a2 2 0 0 1-2-2z" fill="var(--brand-ink)"/></svg></div>
    <h1>Söhbət</h1>
    <p>Otaqlarda real vaxtda mesajlaş.</p>
    <button class="btn wide" id="gbtn" type="button">Google ilə daxil ol</button>
    <form class="dform" id="dform" hidden>
      <input class="field" id="dname" maxlength="30" placeholder="Adınızı yazın" autocomplete="nickname" required>
      <button class="btn wide" type="submit">Daxil ol</button>
    </form>
    <div class="note" id="note" hidden></div>
  </div>
</section>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="side-h">
      <span id="me-av"></span>
      <div class="who"><b id="me-name"></b><small id="me-mode"></small></div>
      <button class="link" id="out" type="button">Çıxış</button>
    </div>
    <div class="tools">
      <button class="btn" id="newroom" type="button">+ Yeni otaq</button>
      <form class="dform" id="roomform" hidden>
        <input class="field" id="roomname" maxlength="40" placeholder="Otağın adı" autocomplete="off">
        <button class="btn" type="submit">Yarat</button>
      </form>
    </div>
    <ul class="rooms" id="rooms"></ul>
  </aside>
  <main class="chat">
    <div class="chat-h">
      <button class="back" id="back" type="button" aria-label="Otaqlara qayıt">←</button>
      <div class="t"><b id="room-title">Otaq seçin</b><small id="room-sub"></small></div>
    </div>
    <div class="msgs" id="msgs" aria-live="polite">
      <div class="placeholder"><b>Otaq seçin</b><span>Soldakı siyahıdan otaq aç və ya yenisini yarat.</span></div>
    </div>
    <form class="composer" id="composer" hidden>
      <input class="field" id="text" maxlength="1000" placeholder="Mesaj yazın" autocomplete="off" aria-label="Mesaj">
      <button class="btn" type="submit" id="send">Göndər</button>
    </form>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module">
/* ====== Firebase konfiqurasiyası: Firebase konsolundan götürdüyün dəyərlərlə əvəz et ====== */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
/* ========================================================================================= */

const DEMO = !firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('YOUR_') === 0;
const $ = id => document.getElementById(id);
const FB_VERSION = '10.12.2';

/* ---------- köməkçilər ---------- */
function hue(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function ini(s){return (s||'?').trim().charAt(0).toUpperCase()}
function avatar(name,photo){
  const el=document.createElement('span');el.className='av';
  el.style.background='hsl('+hue(name||'?')+' 45% 42%)';
  el.textContent=ini(name);
  if(photo){
    const im=new Image();im.alt='';im.referrerPolicy='no-referrer';
    im.onload=()=>{el.textContent='';el.appendChild(im)};
    im.src=photo;
  }
  return el;
}
let toastTimer=null;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},4500);
}
function showErr(e){
  console.error(e);
  const c=e&&e.code||'';
  if(c==='permission-denied')toast('İcazə yoxdur. Firestore qaydalarını və giriş statusunu yoxlayın.');
  else if(c==='auth/unauthorized-domain')toast('Bu domen Firebase-də icazəli deyil. Authorized domains bölməsinə əlavə edin.');
  else toast('Xəta baş verdi. Bir az sonra yenidən cəhd edin.');
}
function memStore(){const m=new Map();return{getItem:k=>m.has(k)?m.get(k):null,setItem:(k,v)=>m.set(k,String(v)),removeItem:k=>m.delete(k)}}

/* ---------- DEMO backend (localStorage; eyni brauzerin tab-ları arasında işləyir) ---------- */
function demoBackend(){
  let LS=window.localStorage,SS=window.sessionStorage;
  try{LS.setItem('_t','1');LS.removeItem('_t')}catch(e){LS=memStore()}
  try{SS.setItem('_t','1');SS.removeItem('_t')}catch(e){SS=memStore()}
  const rd=(S,k,d)=>{try{const v=S.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}};
  const wr=(S,k,v)=>{try{S.setItem(k,JSON.stringify(v))}catch(e){}};
  const subs=new Set();const ping=()=>subs.forEach(f=>f());
  window.addEventListener('storage',e=>{if(e.key&&e.key.indexOf('safchat_')===0)ping()});
  let authCb=null;
  function rooms(){
    let r=rd(LS,'safchat_rooms',null);
    if(!r){
      r=[{id:'umumi',name:'Ümumi'},{id:'suallar',name:'Suallar'}];
      wr(LS,'safchat_rooms',r);
      wr(LS,'safchat_msgs_umumi',[{id:'s1',uid:'sys',name:'Söhbət',photo:'',text:'Bu demo rejimidir: mesajlar yalnız bu brauzerdə saxlanır. Saytı ikinci pəncərədə açıb başqa adla daxil olsan, mesajları real vaxtda görəcəksən.',t:Date.now()}]);
    }
    return r;
  }
  return{
    mode:'Demo rejimi',
    onAuth(cb){authCb=cb;cb(rd(SS,'safchat_user',null))},
    async signIn(name){const u={uid:'d'+Math.random().toString(36).slice(2,10),name:(name||'Qonaq').slice(0,30),photo:''};wr(SS,'safchat_user',u);authCb&&authCb(u)},
    async signOut(){try{SS.removeItem('safchat_user')}catch(e){}authCb&&authCb(null)},
    listenRooms(cb){const f=()=>cb(rooms());subs.add(f);f();return()=>subs.delete(f)},
    async createRoom(name){const r=rooms();const id='r'+Date.now().toString(36);r.push({id,name});wr(LS,'safchat_rooms',r);ping();return id},
    listenMessages(id,cb){const f=()=>cb(rd(LS,'safchat_msgs_'+id,[]));subs.add(f);f();return()=>subs.delete(f)},
    async send(id,text){
      const me=rd(SS,'safchat_user',null);if(!me)return;
      const l=rd(LS,'safchat_msgs_'+id,[]);
      l.push({id:'m'+Date.now()+Math.random().toString(36).slice(2,6),uid:me.uid,name:me.name,photo:'',text,t:Date.now()});
      wr(LS,'safchat_msgs_'+id,l.slice(-200));ping();
    }
  };
}

/* ---------- Firebase backend ---------- */
async function firebaseBackend(){
  const base='https://www.gstatic.com/firebasejs/'+FB_VERSION+'/';
  const [appM,A,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=appM.initializeApp(firebaseConfig);
  const auth=A.getAuth(app),db=F.getFirestore(app);
  return{
    mode:'Google hesabı',
    onAuth(cb){A.onAuthStateChanged(auth,u=>cb(u?{uid:u.uid,name:u.displayName||'İstifadəçi',photo:u.photoURL||''}:null))},
    async signIn(){
      const p=new A.GoogleAuthProvider();
      try{await A.signInWithPopup(auth,p)}
      catch(e){
        if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')await A.signInWithRedirect(auth,p);
        else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')throw e;
      }
    },
    signOut(){return A.signOut(auth)},
    listenRooms(cb){
      const q=F.query(F.collection(db,'rooms'),F.orderBy('createdAt','asc'));
      return F.onSnapshot(q,async s=>{
        if(s.empty){
          try{await F.setDoc(F.doc(db,'rooms','umumi'),{name:'Ümumi',createdAt:F.serverTimestamp(),createdBy:auth.currentUser.uid})}catch(e){showErr(e)}
          return;
        }
        cb(s.docs.map(d=>({id:d.id,name:d.data().name})));
      },showErr);
    },
    async createRoom(name){
      const r=await F.addDoc(F.collection(db,'rooms'),{name,createdAt:F.serverTimestamp(),createdBy:auth.currentUser.uid});
      return r.id;
    },
    listenMessages(id,cb){
      const q=F.query(F.collection(db,'rooms',id,'messages'),F.orderBy('createdAt','desc'),F.limit(100));
      return F.onSnapshot(q,s=>{
        cb(s.docs.map(d=>{
          const x=d.data({serverTimestamps:'estimate'});
          return{id:d.id,uid:x.uid,name:x.name,photo:x.photo,text:x.text,t:x.createdAt?x.createdAt.toMillis():Date.now()};
        }).reverse());
      },showErr);
    },
    send(id,text){
      const u=auth.currentUser;
      return F.addDoc(F.collection(db,'rooms',id,'messages'),{text,uid:u.uid,name:u.displayName||'İstifadəçi',photo:u.photoURL||'',createdAt:F.serverTimestamp()});
    }
  };
}

/* ---------- tətbiq məntiqi ---------- */
let backend=null,me=null,room=null,unsubRooms=null,unsubMsgs=null,firstRender=true;
const isWide=()=>window.matchMedia('(min-width:761px)').matches;

function show(app){ $('login').hidden=app; $('app').hidden=!app; }

function cleanup(){
  if(unsubRooms){unsubRooms();unsubRooms=null}
  if(unsubMsgs){unsubMsgs();unsubMsgs=null}
  room=null;
}

function renderRooms(list){
  const ul=$('rooms');ul.textContent='';
  list.forEach(r=>{
    const li=document.createElement('li');
    const b=document.createElement('button');b.type='button';b.className='room'+(room&&room.id===r.id?' on':'');
    const n=document.createElement('span');n.className='rn';n.textContent=r.name;
    b.appendChild(avatar(r.name,''));b.appendChild(n);
    b.addEventListener('click',()=>openRoom(r.id,r.name));
    li.appendChild(b);ul.appendChild(li);
  });
  if(!room&&list.length&&isWide())openRoom(list[0].id,list[0].name);
}

function openRoom(id,name){
  if(unsubMsgs){unsubMsgs();unsubMsgs=null}
  room={id,name};firstRender=true;
  $('room-title').textContent=name;
  $('room-sub').textContent='';
  $('composer').hidden=false;
  $('app').classList.add('in-chat');
  document.querySelectorAll('.room').forEach(el=>el.classList.toggle('on',el.querySelector('.rn').textContent===name));
  const box=$('msgs');box.textContent='';
  unsubMsgs=backend.listenMessages(id,renderMsgs);
  if(isWide())$('text').focus();
}

function dayLabel(t){
  const d=new Date(t),n=new Date();
  if(d.toDateString()===n.toDateString())return 'Bu gün';
  return d.toLocaleDateString('az-AZ',{day:'numeric',month:'long'});
}

function renderMsgs(list){
  const box=$('msgs');
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<140;
  box.textContent='';
  if(!list.length){
    const e=document.createElement('div');e.className='empty';e.textContent='Hələ mesaj yoxdur. İlk mesajı sən yaz.';box.appendChild(e);return;
  }
  let lastDay='',lastUid=null;
  const parts=new Set();
  list.forEach(m=>{
    const dl=dayLabel(m.t);
    if(dl!==lastDay){const d=document.createElement('div');d.className='day';d.textContent=dl;box.appendChild(d);lastDay=dl;lastUid=null}
    const mine=me&&m.uid===me.uid;
    const el=document.createElement('div');
    el.className='m '+(mine?'me':'o')+(m.uid!==lastUid?' first':'');
    if(!mine&&m.uid!==lastUid){const n=document.createElement('span');n.className='nm';n.textContent=m.name||'İstifadəçi';el.appendChild(n)}
    const tx=document.createElement('span');tx.textContent=m.text;el.appendChild(tx);
    const tm=document.createElement('span');tm.className='tm';
    tm.textContent=new Date(m.t).toLocaleTimeString('az-AZ',{hour:'2-digit',minute:'2-digit'});
    el.appendChild(tm);
    box.appendChild(el);lastUid=m.uid;parts.add(m.uid);
  });
  $('room-sub').textContent=parts.size+' iştirakçı (son mesajlar)';
  if(near||firstRender)box.scrollTop=box.scrollHeight;
  firstRender=false;
}

function onUser(u){
  me=u;
  if(!u){cleanup();show(false);return}
  show(true);
  const av=$('me-av');av.textContent='';av.appendChild(avatar(u.name,u.photo));
  $('me-name').textContent=u.name;
  $('me-mode').textContent=backend.mode;
  $('app').classList.remove('in-chat');
  $('composer').hidden=true;
  $('room-title').textContent='Otaq seçin';$('room-sub').textContent='';
  const box=$('msgs');box.textContent='';
  const ph=document.createElement('div');ph.className='placeholder';
  const b=document.createElement('b');b.textContent='Otaq seçin';
  const s=document.createElement('span');s.textContent='Soldakı siyahıdan otaq aç və ya yenisini yarat.';
  ph.appendChild(b);ph.appendChild(s);box.appendChild(ph);
  cleanup();
  unsubRooms=backend.listenRooms(renderRooms);
}

/* ---------- hadisələr ---------- */
$('gbtn').addEventListener('click',()=>{backend.signIn().catch(showErr)});
$('dform').addEventListener('submit',e=>{e.preventDefault();const n=$('dname').value.trim();if(n)backend.signIn(n)});
$('out').addEventListener('click',()=>backend.signOut());
$('back').addEventListener('click',()=>{$('app').classList.remove('in-chat')});
$('newroom').addEventListener('click',()=>{const f=$('roomform');f.hidden=!f.hidden;if(!f.hidden)$('roomname').focus()});
$('roomform').addEventListener('submit',async e=>{
  e.preventDefault();
  const n=$('roomname').value.trim();if(!n)return;
  try{const id=await backend.createRoom(n);$('roomname').value='';$('roomform').hidden=true;openRoom(id,n)}catch(err){showErr(err)}
});
$('composer').addEventListener('submit',e=>{
  e.preventDefault();
  const t=$('text').value.trim();if(!t||!room)return;
  $('text').value='';
  Promise.resolve(backend.send(room.id,t)).catch(showErr);
});

/* ---------- start ---------- */
(async function start(){
  const note=$('note');

    }else{
      backend=await firebaseBackend();
    }

  }
})();
</script>
